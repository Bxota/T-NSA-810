---
# Les routeurs/pare-feux sont des pfSense, configurés via config.xml (hors Ansible).
# Ansible ne gère que les 4 VMs applicatives.

# ── 1. Setup commun sur toutes les VMs applicatives ───────────────────────────
- name: Common setup all app VMs
  hosts: netbox:elasticsearch:bastion:webserver
  become: true
  roles: [common]

# ── 2. Services Site 1 ────────────────────────────────────────────────────────
- name: Deploy NetBox
  hosts: netbox
  become: true
  roles: [netbox, filebeat, metricbeat]

- name: Deploy Elasticsearch + Kibana
  hosts: elasticsearch
  become: true
  roles: [elasticsearch, filebeat, metricbeat]

# ── 3. Services Site 2 ────────────────────────────────────────────────────────
- name: Deploy Bastion
  hosts: bastion
  become: true
  roles: [bastion, filebeat, metricbeat]

- name: Deploy Webserver
  hosts: webserver
  become: true
  roles: [webserver, filebeat, metricbeat]
