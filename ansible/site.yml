---
# ── 1. Routers en premier : ils fournissent la gateway aux autres VMs ─────────
- name: Setup router Site 1
  hosts: router_s1
  become: true
  roles: [common, router]

# Le router S2 peut être configuré en parallèle SAUF pour la partie client VPN
# (qui nécessite le client.ovpn généré par router_s1). Le common est safe.
- name: Common setup router Site 2
  hosts: router_s2
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for router S2 SSH
      wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather router S2 facts
      setup:
  roles: [common]

# La config VPN client sur S2 se fait après que S1 ait généré le client.ovpn
- name: Setup router Site 2 (VPN client)
  hosts: router_s2
  become: true
  roles: [router]

# ── 2. Setup commun sur toutes les VMs applicatives ───────────────────────────
- name: Common setup all app VMs
  hosts: all:!proxmox_s1:!proxmox_s2:!router_s1:!router_s2
  become: true
  roles: [common]

# ── 3. Services Site 1 ────────────────────────────────────────────────────────
- name: Deploy NetBox
  hosts: netbox
  become: true
  roles: [netbox, filebeat]

- name: Deploy Elasticsearch + Kibana
  hosts: elasticsearch
  become: true
  roles: [elasticsearch, filebeat]

# ── 4. Services Site 2 ────────────────────────────────────────────────────────
- name: Deploy Bastion
  hosts: bastion
  become: true
  roles: [bastion, filebeat]

- name: Deploy Webserver
  hosts: webserver
  become: true
  roles: [webserver, filebeat]
