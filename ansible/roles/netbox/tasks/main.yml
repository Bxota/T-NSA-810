- name: Install dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - postgresql
      - postgresql-contrib
      - redis-server
      - nginx
      - git
      - libpq-dev
    state: present
  async: 600
  poll: 20

- name: Create netbox DB user
  become_user: postgres
  postgresql_user:
    name: netbox
    password: "{{ netbox_db_password }}"

- name: Create netbox database
  become_user: postgres
  postgresql_db:
    name: netbox
    owner: netbox

- name: Create netbox system user
  user:
    name: netbox
    system: yes
    home: /home/netbox
    create_home: yes

- name: Check if /opt/netbox is a git repo
  stat:
    path: /opt/netbox/.git
  register: netbox_git_dir

- name: Remove /opt/netbox if not a git repo (leftover from failed run)
  file:
    path: /opt/netbox
    state: absent
  when: not netbox_git_dir.stat.exists

- name: Create /opt/netbox directory owned by netbox
  file:
    path: /opt/netbox
    state: directory
    owner: netbox
    group: netbox
    mode: '0755'

- name: Clone NetBox v4.2
  become: yes
  become_user: netbox
  git:
    repo: https://github.com/netbox-community/netbox.git
    dest: /opt/netbox
    version: v4.2.0
    depth: 1

- name: Generate SECRET_KEY if not provided or too short
  shell: |
    python3 -c "import secrets; print(secrets.token_urlsafe(60))" > /etc/netbox-secret-key
    chmod 600 /etc/netbox-secret-key
  args:
    creates: /etc/netbox-secret-key
  when: netbox_secret_key | length < 50

- name: Read generated SECRET_KEY from file
  slurp:
    src: /etc/netbox-secret-key
  register: generated_secret_key
  when: netbox_secret_key | length < 50

- name: Set netbox_secret_key from generated file
  set_fact:
    netbox_secret_key: "{{ generated_secret_key.content | b64decode | trim }}"
  when: netbox_secret_key | length < 50

- name: Deploy configuration.py
  template:
    src: configuration.py.j2
    dest: /opt/netbox/netbox/netbox/configuration.py
    owner: netbox

- name: Run upgrade script (install venv + dependencies)
  command: /opt/netbox/upgrade.sh
  args:
    creates: /opt/netbox/venv/bin/gunicorn
  async: 1800
  poll: 30

- name: Run database migrations
  command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py migrate --no-input
  become_user: netbox

- name: Create superuser
  shell: |
    /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell -c "
    from django.contrib.auth import get_user_model
    User = get_user_model()
    if not User.objects.filter(username='{{ netbox_admin_user }}').exists():
        User.objects.create_superuser('{{ netbox_admin_user }}', 'admin@cia.local', '{{ netbox_admin_password }}')
        print('created')
    else:
        print('exists')
    "
  become_user: netbox
  register: superuser_result
  changed_when: "'created' in superuser_result.stdout"

- name: Create static directory and set ownership
  file:
    path: /opt/netbox/netbox/static
    state: directory
    owner: netbox
    group: netbox
    mode: "0755"

- name: Set netbox ownership on /opt/netbox
  file:
    path: /opt/netbox
    owner: netbox
    group: netbox
    recurse: yes

- name: Collect static files
  command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py collectstatic --no-input
  become_user: netbox

- name: Set static files permissions for nginx
  file:
    path: /opt/netbox/netbox/static
    owner: netbox
    group: www-data
    mode: "0755"
    recurse: yes

- name: Deploy systemd service
  template:
    src: netbox.service.j2
    dest: /etc/systemd/system/netbox.service
  notify: reload systemd

- name: Deploy nginx config for NetBox
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/netbox
  notify: restart nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/netbox
    dest: /etc/nginx/sites-enabled/netbox
    state: link
  notify: restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Enable and start NetBox and nginx
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - netbox
    - nginx

- name: Create Terraform API token
  shell: |
    /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell -c "
    from users.models import Token
    from django.contrib.auth import get_user_model
    User = get_user_model()
    user = User.objects.get(username='{{ netbox_admin_user }}')
    token, created = Token.objects.get_or_create(
        user=user,
        defaults={'key': '{{ netbox_terraform_token }}', 'description': 'Terraform IPAM'}
    )
    if not created and token.key != '{{ netbox_terraform_token }}':
        token.key = '{{ netbox_terraform_token }}'
        token.save()
    "
  become_user: netbox
  changed_when: false