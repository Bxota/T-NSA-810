- name: Install OpenVPN and Easy-RSA
  apt:
    name:
      - openvpn
      - easy-rsa
      - iptables-persistent
    state: present

- name: Create Easy-RSA working directory
  file:
    path: /etc/openvpn/easy-rsa
    state: directory
    mode: "0700"

- name: Copy Easy-RSA files
  shell: cp -r /usr/share/easy-rsa/* /etc/openvpn/easy-rsa/
  args:
    creates: /etc/openvpn/easy-rsa/easyrsa

- name: Initialize PKI
  shell: ./easyrsa init-pki
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki

- name: Build CA (nopass for automation)
  shell: EASYRSA_BATCH=1 EASYRSA_CA_EXPIRE=3650 ./easyrsa build-ca nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/ca.crt

- name: Generate server certificate
  shell: EASYRSA_BATCH=1 EASYRSA_CERT_EXPIRE=3650 ./easyrsa build-server-full server nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/issued/server.crt

- name: Generate client certificate
  shell: EASYRSA_BATCH=1 EASYRSA_CERT_EXPIRE=3650 ./easyrsa build-client-full client nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/issued/client.crt

- name: Generate DH parameters
  shell: EASYRSA_BATCH=1 ./easyrsa gen-dh
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/dh.pem
  async: 300
  poll: 10

- name: Generate TLS auth key
  shell: openvpn --genkey secret /etc/openvpn/ta.key
  args:
    creates: /etc/openvpn/ta.key

- name: Copy PKI files to OpenVPN directory
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: yes
    mode: "0600"
  loop:
    - src: /etc/openvpn/easy-rsa/pki/ca.crt
      dest: /etc/openvpn/ca.crt
    - src: /etc/openvpn/easy-rsa/pki/issued/server.crt
      dest: /etc/openvpn/server.crt
    - src: /etc/openvpn/easy-rsa/pki/private/server.key
      dest: /etc/openvpn/server.key
    - src: /etc/openvpn/easy-rsa/pki/dh.pem
      dest: /etc/openvpn/dh.pem

- name: Deploy OpenVPN server config
  template:
    src: server.conf.j2
    dest: /etc/openvpn/server/server.conf
    mode: "0600"
  notify: restart openvpn

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: Set up NAT for VPN clients
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ vpn_subnet }}"
    jump: MASQUERADE
  notify: save iptables

- name: Enable and start OpenVPN
  systemd:
    name: openvpn-server@server
    enabled: yes
    state: started

- name: Read CA cert
  slurp:
    src: /etc/openvpn/ca.crt
  register: ca_cert

- name: Read client cert
  slurp:
    src: /etc/openvpn/easy-rsa/pki/issued/client.crt
  register: client_cert

- name: Read client key
  slurp:
    src: /etc/openvpn/easy-rsa/pki/private/client.key
  register: client_key

- name: Read TLS auth key
  slurp:
    src: /etc/openvpn/ta.key
  register: ta_key

- name: Generate client .ovpn file on server
  template:
    src: client.ovpn.j2
    dest: /etc/openvpn/client.ovpn
    mode: "0600"

- name: Fetch client .ovpn to local machine
  fetch:
    src: /etc/openvpn/client.ovpn
    dest: "{{ playbook_dir }}/../client.ovpn"
    flat: yes
