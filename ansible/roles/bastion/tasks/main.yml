- name: Install bastion packages
  apt:
    name:
      - openssh-server
      - libpam-google-authenticator
      - auditd
      - fail2ban
    state: present

- name: Harden sshd_config
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

- name: Configure PAM 2FA
  lineinfile:
    path: /etc/pam.d/sshd
    insertbefore: BOF
    line: "auth required pam_google_authenticator.so"

- name: Configure auditd rules
  template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/cia.rules
  notify: restart auditd

- name: Enable services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - ssh
    - auditd
    - fail2ban