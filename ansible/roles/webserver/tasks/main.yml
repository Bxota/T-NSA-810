- name: Install Nginx
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: yes

- name: Deploy nginx site config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/cia
  notify: restart nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/cia
    dest: /etc/nginx/sites-enabled/cia
    state: link
  notify: restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Enable nginx
  systemd:
    name: nginx
    enabled: yes
    state: started
