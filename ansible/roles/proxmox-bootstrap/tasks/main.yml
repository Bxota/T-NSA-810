- name: Install iptables-persistent
  apt:
    name: iptables-persistent
    state: present

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: NAT masquerade for site1 (vmbr1 -> vmbr0)
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: vmbr0
    source: "{{ lan_s1 }}"
    jump: MASQUERADE

- name: NAT masquerade for site2 (vmbr2 -> vmbr0)
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: vmbr0
    source: "{{ lan_s2 }}"
    jump: MASQUERADE

- name: DNAT OpenVPN UDP 1194 -> bastion
  iptables:
    table: nat
    chain: PREROUTING
    in_interface: vmbr0
    protocol: udp
    destination_port: "1194"
    jump: DNAT
    to_destination: "10.2.0.5:1194"

- name: FORWARD rule for OpenVPN traffic to bastion
  iptables:
    chain: FORWARD
    protocol: udp
    destination: "10.2.0.5"
    destination_port: "1194"
    jump: ACCEPT

- name: Save iptables rules (IPv4)
  shell: netfilter-persistent save
  notify: reload iptables
