---
# ── Packages ──────────────────────────────────────────────────────────────────
- name: Install router packages
  apt:
    name:
      - openvpn
      - easy-rsa
      - iptables-persistent
      - dnsmasq
    state: present
    update_cache: yes

# ── IP Forwarding ─────────────────────────────────────────────────────────────
- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

# ── NAT ───────────────────────────────────────────────────────────────────────
- name: NAT masquerade LAN → WAN
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ wan_interface }}"
    source: "{{ lan_network }}"
    jump: MASQUERADE
  notify: save iptables

- name: Accept FORWARD pour trafic LAN
  iptables:
    chain: FORWARD
    in_interface: "{{ lan_interface }}"
    jump: ACCEPT
  notify: save iptables

- name: Accept FORWARD pour trafic établi/related
  iptables:
    chain: FORWARD
    match: state
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
  notify: save iptables

# ── OpenVPN SERVER (router_s1) ────────────────────────────────────────────────
- name: "[server] Créer dossier easy-rsa"
  file:
    path: /etc/openvpn/easy-rsa
    state: directory
    mode: "0700"
  when: router_role == "server"

- name: "[server] Copier easy-rsa"
  shell: cp -r /usr/share/easy-rsa/* /etc/openvpn/easy-rsa/
  args:
    creates: /etc/openvpn/easy-rsa/easyrsa
  when: router_role == "server"

- name: "[server] Initialiser PKI"
  shell: ./easyrsa init-pki
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki
  when: router_role == "server"

- name: "[server] Créer CA"
  shell: EASYRSA_BATCH=1 EASYRSA_CA_EXPIRE=3650 ./easyrsa build-ca nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/ca.crt
  when: router_role == "server"

- name: "[server] Créer certificat serveur"
  shell: EASYRSA_BATCH=1 EASYRSA_CERT_EXPIRE=3650 ./easyrsa build-server-full server nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/issued/server.crt
  when: router_role == "server"

- name: "[server] Créer certificat client"
  shell: EASYRSA_BATCH=1 EASYRSA_CERT_EXPIRE=3650 ./easyrsa build-client-full client nopass
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/issued/client.crt
  when: router_role == "server"

- name: "[server] Générer paramètres DH"
  shell: EASYRSA_BATCH=1 ./easyrsa gen-dh
  args:
    chdir: /etc/openvpn/easy-rsa
    creates: /etc/openvpn/easy-rsa/pki/dh.pem
  async: 300
  poll: 10
  when: router_role == "server"

- name: "[server] Reconnecter SSH après génération DH"
  wait_for_connection:
    timeout: 30
  when: router_role == "server"

- name: "[server] Générer clé TLS auth"
  shell: openvpn --genkey secret /etc/openvpn/ta.key
  args:
    creates: /etc/openvpn/ta.key
  when: router_role == "server"

- name: "[server] Copier fichiers PKI → /etc/openvpn"
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: yes
    mode: "0600"
  loop:
    - { src: /etc/openvpn/easy-rsa/pki/ca.crt,               dest: /etc/openvpn/ca.crt }
    - { src: /etc/openvpn/easy-rsa/pki/issued/server.crt,     dest: /etc/openvpn/server.crt }
    - { src: /etc/openvpn/easy-rsa/pki/private/server.key,    dest: /etc/openvpn/server.key }
    - { src: /etc/openvpn/easy-rsa/pki/dh.pem,                dest: /etc/openvpn/dh.pem }
  when: router_role == "server"

- name: "[server] Créer dossier log OpenVPN"
  file:
    path: /var/log/openvpn
    state: directory
    mode: "0755"
  when: router_role == "server"

- name: "[server] Déployer server.conf"
  template:
    src: server.conf.j2
    dest: /etc/openvpn/server/server.conf
    mode: "0600"
  notify: restart openvpn server
  when: router_role == "server"

- name: "[server] NAT masquerade pour clients VPN"
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ vpn_subnet }}"
    jump: MASQUERADE
  notify: save iptables
  when: router_role == "server"

- name: "[server] Démarrer openvpn-server"
  systemd:
    name: openvpn-server@server
    enabled: yes
    state: started
  when: router_role == "server"

- name: "[server] Lire fichiers pour client.ovpn"
  slurp:
    src: "{{ item }}"
  register: ovpn_files_raw
  loop:
    - /etc/openvpn/ca.crt
    - /etc/openvpn/easy-rsa/pki/issued/client.crt
    - /etc/openvpn/easy-rsa/pki/private/client.key
    - /etc/openvpn/ta.key
  when: router_role == "server"

- name: "[server] Préparer variables pour client.ovpn"
  set_fact:
    ca_cert:     "{{ ovpn_files_raw.results[0] }}"
    client_cert: "{{ ovpn_files_raw.results[1] }}"
    client_key:  "{{ ovpn_files_raw.results[2] }}"
    ta_key:      "{{ ovpn_files_raw.results[3] }}"
  when: router_role == "server"

- name: "[server] Générer client.ovpn sur le serveur"
  template:
    src: client.ovpn.j2
    dest: /etc/openvpn/client.ovpn
    mode: "0600"
  when: router_role == "server"

- name: "[server] Récupérer client.ovpn en local"
  fetch:
    src: /etc/openvpn/client.ovpn
    dest: "{{ playbook_dir }}/../client.ovpn"
    flat: yes
  when: router_role == "server"

# ── OpenVPN CLIENT (router_s2) ────────────────────────────────────────────────
- name: "[client] Copier client.ovpn vers le router S2"
  copy:
    src: "{{ playbook_dir }}/../client.ovpn"
    dest: /etc/openvpn/client/client.conf
    mode: "0600"
  notify: restart openvpn client
  when: router_role == "client"

- name: "[client] Démarrer openvpn-client"
  systemd:
    name: openvpn-client@client
    enabled: yes
    state: started
  async: 30
  poll: 0
  when: router_role == "client"

- name: "[client] Attendre que le tunnel VPN soit établi"
  wait_for:
    host: 10.8.0.1
    port: 0
    delay: 5
    timeout: 60
    msg: "Tunnel VPN non établi après 60s"
  when: router_role == "client"
  ignore_errors: yes

# ── Routes statiques inter-sites via VPN ──────────────────────────────────────
- name: "Ajouter route vers LAN distant via VPN (server: vers S2)"
  shell: |
    ip route add {{ lan_s2 }} via 10.8.0.2 dev tun0 2>/dev/null || true
  when: router_role == "server"
  ignore_errors: yes

- name: "Ajouter route vers LAN distant via VPN (client: vers S1)"
  shell: |
    ip route add {{ lan_s1 }} via 10.8.0.1 dev tun0 2>/dev/null || true
  when: router_role == "client"
  ignore_errors: yes
