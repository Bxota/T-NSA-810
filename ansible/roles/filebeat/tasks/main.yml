- name: Add Elastic GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elastic repo
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present

- name: Install Filebeat
  apt:
    name: filebeat
    state: present
    update_cache: yes

- name: Deploy filebeat.yml
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
  notify: restart filebeat

- name: Deploy module configs (parsing)
  template:
    src: "{{ item }}.yml.j2"
    dest: "/etc/filebeat/modules.d/{{ item }}.yml"
  loop: "{{ filebeat_modules }}"
  notify: restart filebeat

- name: Push ingest pipelines to Elasticsearch
  # Pas de --modules : lit les filesets activés dans modules.d/
  command: "filebeat setup --pipelines"
  register: fb_setup
  changed_when: "'Loaded Ingest pipelines' in fb_setup.stdout"

- name: Enable filebeat
  systemd:
    name: filebeat
    enabled: yes
    state: started
