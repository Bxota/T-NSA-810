all:
  vars:
    ansible_user: cia
    ansible_ssh_private_key_file: /tmp/cia_infra
    ansible_ssh_common_args: >-
      -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p root@192.168.1.37"
      -o StrictHostKeyChecking=no

  hosts:
    proxmox:
      ansible_host: 192.168.241.129
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  children:
    site1:
      hosts:
        netbox:
          ansible_host: 10.1.0.10
        elasticsearch:
          ansible_host: 10.1.0.20

    site2:
      hosts:
        bastion:
          ansible_host: 10.2.0.5
        webserver:
          ansible_host: 10.2.0.30
          ansible_ssh_common_args: >-
            -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p root@192.168.1.37"
            -o ProxyJump=cia@10.2.0.5
            -o StrictHostKeyChecking=no
