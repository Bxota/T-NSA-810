all:
  vars:
    ansible_user: cia
    ansible_ssh_private_key_file: /tmp/cia_infra

  hosts:
    proxmox_s1:
      ansible_host: "{{ lookup('env', 'PROXMOX_S1_IP') }}"
      ansible_user: root
      ansible_ssh_private_key_file: /tmp/cia_infra
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    proxmox_s2:
      ansible_host: "{{ lookup('env', 'PROXMOX_S2_IP') }}"
      ansible_user: root
      ansible_ssh_private_key_file: /tmp/cia_infra
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  children:
    # ── pfSense (config poussée par SSH ; shell admin = /bin/sh requis) ────────
    pfsense:
      hosts:
        pfsense_s1:
          ansible_host: 10.1.0.1
          ansible_user: admin
          ansible_ssh_pass: "{{ pfsense_admin_password }}"
          ansible_ssh_common_args: "-o ProxyJump=root@{{ lookup('env','PROXMOX_S1_IP') }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          proxmox_jump_ip: "{{ lookup('env','PROXMOX_S1_IP') }}"
          pfsense_config_file: config-pf-s1.s1.cia-final.xml
          site: s1
        pfsense_s2:
          ansible_host: 10.2.0.1
          ansible_user: admin
          ansible_ssh_pass: "{{ pfsense_admin_password }}"
          ansible_ssh_common_args: "-o ProxyJump=root@{{ lookup('env','PROXMOX_S2_IP') }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          proxmox_jump_ip: "{{ lookup('env','PROXMOX_S2_IP') }}"
          pfsense_config_file: config-pf-s2.s2.cia-final.xml
          site: s2

    # ── Site 1 (derrière pfSense pf-s1, gateway 10.1.0.1) ──────────────────────
    site1:
      hosts:
        netbox:
          ansible_host: 10.1.0.10
        elasticsearch:
          ansible_host: 10.1.0.20

    # ── Site 2 (derrière pfSense pf-s2, gateway 10.2.0.1) ──────────────────────
    site2:
      hosts:
        bastion:
          ansible_host: 10.2.0.5
        webserver:
          ansible_host: 10.2.0.30
