all:
  vars:
    ansible_user: cia
    ansible_ssh_private_key_file: /tmp/cia_infra

  hosts:
    proxmox_s1:
      ansible_host: "{{ lookup('env', 'PROXMOX_S1_IP') }}"
      ansible_user: root
      ansible_ssh_private_key_file: /tmp/cia_infra
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    proxmox_s2:
      ansible_host: "{{ lookup('env', 'PROXMOX_S2_IP') }}"
      ansible_user: root
      ansible_ssh_private_key_file: /tmp/cia_infra
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  children:
    # ── Firewalls/routeurs pfSense (connexion shell sh, pas de cloud-init) ─────
    pfsense:
      vars:
        ansible_user: admin
        ansible_password: "{{ lookup('env', 'PFSENSE_ADMIN_PASSWORD') }}"
        ansible_shell_type: sh
        ansible_python_interpreter: /usr/local/bin/python3.11
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=password
      hosts:
        pfsense_s1:
          ansible_host: 10.1.0.1
          router_role: server
          pfsense_lan_ip: "10.1.0.1"
          pfsense_domain: "s1.local"
          pfsense_wan_if: vtnet0
          local_lan: "10.1.0.0/24"
          remote_lan: "10.2.0.0/24"
          remote_domain: "s2.local"
          remote_router_ip: "10.2.0.1"
        pfsense_s2:
          ansible_host: 10.2.0.1
          router_role: client
          pfsense_lan_ip: "10.2.0.1"
          pfsense_domain: "s2.local"
          pfsense_wan_if: vtnet0
          local_lan: "10.2.0.0/24"
          remote_lan: "10.1.0.0/24"
          remote_domain: "s1.local"
          remote_router_ip: "10.1.0.1"

    # ── Site 1 ───────────────────────────────────────────────────────────────
    site1:
      hosts:
        netbox:
          ansible_host: 10.1.0.10
        elasticsearch:
          ansible_host: 10.1.0.20

    # ── Site 2 ───────────────────────────────────────────────────────────────
    site2:
      hosts:
        bastion:
          ansible_host: 10.2.0.5
        webserver:
          ansible_host: 10.2.0.30
